name: USB helper environment and recovery tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  helper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap and test Unix
        if: runner.os != 'Windows'
        run: |
          sh usb-helper/start.command --doctor
          sh usb-helper/start.command --self-test
      - name: Bootstrap and test Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call usb-helper\start-windows.cmd --doctor
          if errorlevel 1 exit /b 1
          call usb-helper\start-windows.cmd --self-test
